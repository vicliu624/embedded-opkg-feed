name: Build TDVP K230 feed candidate

# This workflow deliberately produces an unsigned, expiring Actions artifact
# only.  A candidate must compile against the exact firmware ABI before it can
# be signed into an immutable feed release; it must never publish Pages or a
# GitHub Release by itself.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable feed revision to cross-build and audit
        required: true
        default: r10
        type: choice
        options:
          - r10

permissions:
  contents: read

concurrency:
  group: tdvp-k230-feed-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feed-candidate:
    name: Cross-build and audit TDVP feed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TDVP_RELEASE: ${{ inputs.release }}
    steps:
      - name: Check out the feed recipe revision
        uses: actions/checkout@v4

      - name: Check recipe policy before the long target build
        run: |
          set -Eeuo pipefail
          run_policy() { local name=$1; shift; echo "POLICY_START $name"; "$@"; echo "POLICY_PASS $name"; }
          for script in scripts/*.sh tests/*.sh packages/*/build.sh; do run_policy "syntax:$script" bash -n "$script"; done
          run_policy audacious bash ./tests/audacious-package-policy.sh
          run_policy wayland-sdk-overlay bash ./tests/tdvp-wayland-sdk-overlay-protocols.sh
          run_policy buildroot-image-ownership python3 ./tests/buildroot-image-ownership.py
          run_policy published-sdk python3 ./tests/published-sdk-contract.py
          run_policy vim bash ./tests/vim-package-policy.sh
          run_policy archive bash ./tests/archive-package-policy.sh
          run_policy git bash ./tests/git-package-policy.sh
          run_policy gh bash ./tests/gh-package-policy.sh
          run_policy python3 bash ./tests/python3-package-policy.sh
          run_policy dev-tools bash ./tests/dev-tools-package-policy.sh
          # The command-package catalogue is validated by the main CI matrix;
          # it is unrelated to the Audacious source/build closure and must not
          # block this focused candidate workflow.
          run_policy source-tools bash ./tests/source-tools-package-policy.sh
          run_policy node22 bash ./tests/node22-package-policy.sh
          run_policy source-lock bash ./tests/source-lock-policy.sh
          run_policy build-all-source-lock bash ./tests/build-all-source-lock-policy.sh
          run_policy source-lock-all bash ./scripts/verify-source-lock.sh --repo-root . --all

      - name: Prepare the published CPU0 SDK and image
        uses: ./.github/actions/published-sdk

      - name: Install reviewed Go host for GitHub CLI source builds
        if: inputs.release == 'r9' || inputs.release == 'r10'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          check-latest: false

      - name: Install reviewed Node v22 RISC-V source-build host
        if: inputs.release == 'r10'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user
          test "$(riscv64-linux-gnu-g++ -dumpversion | cut -d. -f1)" -ge 10
          command -v qemu-riscv64

      - name: Install Audacious host build tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-bin
          command -v glib-compile-resources
          glib-compile-resources --version

      - name: Cross-build selected applications and assemble unsigned feed candidate
        run: |
          bash ./scripts/build-all.sh --platform tdvp-k230-r1 --release "$TDVP_RELEASE" --output candidate-dist
          feed_dir="candidate-dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/$TDVP_RELEASE/riscv64"
          test -s "$feed_dir/Packages"
          packages=(audacious-core audacious-plugins audacious)
          case "$TDVP_RELEASE" in
            r7)
              packages+=(ffprobe vicliu624-lofibox-widget)
              ;;
            r8) packages+=(vim-runtime vim vim-plugin-repeat vim-plugin-surround vim-plugin-commentary vim-plugin-sleuth) ;;
            r9)
              packages+=(
                vim-runtime vim vim-plugin-repeat vim-plugin-surround vim-plugin-commentary vim-plugin-sleuth
                libmgba sdl2 sdl2-ttf tdvp-gba tdvp-mpv tdvp-netsurf
                libbz2 liblzma libzstd archive-tools
                git-runtime git gh
                libpython3.13 python3-runtime python3
                make pkgconf patch diffutils strace
                tdvp-dev-tools
              )
              ;;
            r10)
              packages+=(
                vim-runtime vim vim-plugin-repeat vim-plugin-surround vim-plugin-commentary vim-plugin-sleuth vim-plugin-gitgutter
                libmgba sdl2 sdl2-ttf tdvp-gba tdvp-mpv tdvp-netsurf
                libbz2 liblzma libzstd archive-tools
                git-runtime git gh
                libpython3.13 python3-runtime python3
                make pkgconf patch diffutils strace
                tree less libz libmagic file which libjq jq dos2unix libpcre2-8 grep sed findutils
                libncursesw libreadline gawk
                tdvp-source-tools
                tdvp-dev-tools
                libcares libuv libnghttp2
                libicudata libicuuc libicui18n libicuio
                libnode node npm-runtime npm tdvp-nodejs-tools
              )
              ;;
            *) echo "unsupported candidate release: $TDVP_RELEASE" >&2; exit 64 ;;
          esac
          for package in "${packages[@]}"; do
            find "$feed_dir" -maxdepth 1 -type f -name "${package}_*.ipk" -print -quit | grep -q .
            grep -Eq "^Package: ${package}$" "$feed_dir/Packages"
          done
          bash ./scripts/verify-feed.sh --platform tdvp-k230-r1 "$feed_dir"

      - name: Upload unsigned candidate feed evidence
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-${{ inputs.release }}-unsigned-${{ github.sha }}
          path: candidate-dist
          if-no-files-found: error
          retention-days: 14
