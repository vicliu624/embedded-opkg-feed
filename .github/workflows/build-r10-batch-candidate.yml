name: Build TDVP K230 r10 incremental feed batches

# `build-sdk-base` is the only mode allowed to build the K230 SDK. Every
# `build-package-batch` run restores that immutable SDK cache and builds only
# the requested package closure. Neither mode signs or publishes a release.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the platform base once, or an incremental package cohort
        required: true
        default: build-sdk-base
        type: choice
        options: [build-sdk-base, build-package-batch, merge-batches]
      batch:
        description: Source cohort used only by build-package-batch
        required: true
        default: archive
        type: choice
        options: [archive, audacious-foundation, audacious-core, audacious-plugins, audacious-app, audacious, network-tools, netsurf, media, games, desktop-tools, development-tools, nodejs]
      dependency_run_id:
        description: Successful prior Audacious layer run ID; required by audacious-plugins and audacious-app
        required: false
        default: ''
        type: string
      source_run_ids:
        description: Comma-separated successful package-batch run IDs, used only by merge-batches
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tdvp-k230-r10-${{ inputs.mode }}-${{ inputs.batch }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # This published CPU1/VGLite baseline installs libvg_lite.so.  The runtime
  # catalogue packages that exact target payload, so pinning an older image
  # without BR2_PACKAGE_VG_LITE would produce an invalid feed base.
  TDVP_FIRMWARE_REVISION: 23f210938e4882dbe3663840259c2520868f3b8b
  TDVP_PROFILE: k230_canmv_t_display_rm69a10_labwc_desktop_defconfig
  # Change when the reviewed platform SDK identity or the cached build
  # interface changes. Package source locks deliberately do not affect this key.
  # v3 preserves Buildroot's completed package stamps alongside the staged
  # baseline manifest.  A package-only invocation must see those stamps, or
  # Buildroot would re-run prerequisite packages (including the external
  # toolchain) despite the restored host toolchain and target sysroot.  The
  # cache deliberately excludes flash images.
  TDVP_SDK_CACHE_KEY: tdvp-k230-r1-sdk-23f210938e4882dbe3663840259c2520868f3b8b-rm69a10-v3
  TDVP_BUILDROOT_DL_CACHE_KEY: tdvp-k230-r1-buildroot-dl-23f210938e4882dbe3663840259c2520868f3b8b-rm69a10-v1
  # r2 rejects the earlier incomplete runtime-base cache.  The base is saved
  # only after Packages and its image-provider alternatives have been checked.
  TDVP_RUNTIME_BASE_CACHE_SCHEMA: r2
  # The SDK cache deliberately excludes package build trees. Keep the small,
  # ABI-bound development bridge separately so application batches do not
  # repeatedly materialize development headers from Buildroot sources.
  TDVP_WAYLAND_SDK_OVERLAY_CACHE_SCHEMA: r3

jobs:
  build-sdk-base:
    name: Build and cache the K230 SDK base once
    if: inputs.mode == 'build-sdk-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out the feed recipe revision
        uses: actions/checkout@v6

      - name: Check out the pinned TDVP r1 firmware ABI
        uses: actions/checkout@v6
        with:
          repository: vicliu624/t-display-k230-vision-platform
          ref: 23f210938e4882dbe3663840259c2520868f3b8b
          path: firmware
          submodules: recursive
          fetch-depth: 1

      - name: Check policy before using build capacity
        run: |
          set -Eeuo pipefail
          config="firmware/buildroot/k230-sdk-overlay/configs/$TDVP_PROFILE"
          grep -Fxq 'BR2_PACKAGE_VG_LITE=y' "$config"
          grep -Fxq 'BR2_PACKAGE_TDVP_VGLITE_ACCEPTANCE=y' "$config"
          for script in scripts/*.sh tests/*.sh packages/*/build.sh; do bash -n "$script"; done
          bash ./tests/build-all-source-lock-policy.sh
          bash ./tests/audacious-foundation-policy.sh
          bash ./tests/audacious-package-policy.sh
          bash ./tests/archive-package-policy.sh
          bash ./tests/target-runtime-provider-deferral-policy.sh
          bash ./tests/feed-overlay-composition-policy.sh
          bash ./tests/source-lock-policy.sh
          bash ./scripts/verify-source-lock.sh --repo-root . --all

      - name: Restore the reviewed SDK base cache
        id: restore-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/buildroot-overlay
            ${{ runner.temp }}/tdvp-k230-sdk/.tdvp/sdk-baseline-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/buildroot-2025.02.1
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config.old
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/Makefile
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/host
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/target
          key: ${{ env.TDVP_SDK_CACHE_KEY }}

      # The Buildroot SDK uses the reviewed external Xuantie toolchain through
      # absolute /opt links. Cache it independently of the SDK output so a
      # fresh runner can recreate those links without recompiling the SDK.
      - name: Restore the pinned K230 external toolchain
        uses: actions/cache@v4
        with:
          path: firmware/.ci-cache/toolchain
          key: tdvp-k230-r1-external-toolchain-${{ hashFiles('firmware/buildroot/tools/ci-prepare-host.sh') }}

      - name: Install reproducible TDVP build host
        working-directory: firmware
        run: |
          chmod +x buildroot/tools/*.sh
          bash buildroot/tools/ci-prepare-host.sh

      - name: Stage and build the matching TDVP base
        if: steps.restore-sdk.outputs.cache-hit != 'true'
        working-directory: firmware
        run: |
          worktree="${RUNNER_TEMP}/tdvp-k230-sdk"
          rm -rf "$worktree"
          bash buildroot/tools/prepare-k230-sdk-worktree.sh "$worktree"
          bash buildroot/tools/build-k230-sdk-rm69a10.sh "$worktree"

      - name: Restore the reviewed Buildroot source-download base
        id: restore-buildroot-dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tdvp-k230-sdk/dl
          key: ${{ env.TDVP_BUILDROOT_DL_CACHE_KEY }}

      - name: Populate the reviewed Buildroot source-download base
        if: steps.restore-buildroot-dl.outputs.cache-hit != 'true'
        working-directory: firmware
        run: |
          set -Eeuo pipefail
          worktree="${RUNNER_TEMP}/tdvp-k230-sdk"
          output="$worktree/output/$TDVP_PROFILE"
          mkdir -p "$worktree/dl"
          env -i HOME="${HOME:-/tmp}" USER="${USER:-tdvp}" LOGNAME="${LOGNAME:-tdvp}" \
            PATH="$output/host/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            BR2_PRIMARY_SITE=https://download.kendryte.com/k230/downloads/dl \
            make -C "$output" source

      - name: Save the reviewed Buildroot source-download base
        if: steps.restore-buildroot-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tdvp-k230-sdk/dl
          key: ${{ env.TDVP_BUILDROOT_DL_CACHE_KEY }}

      - name: Verify the cached base identity
        working-directory: firmware
        run: |
          worktree="${RUNNER_TEMP}/tdvp-k230-sdk"
          if [ "${{ steps.restore-sdk.outputs.cache-hit }}" = 'true' ]; then
            bash buildroot/tools/assert-k230-sdk-rm69a10-baseline.sh --patch-only "$worktree"
          else
            bash buildroot/tools/assert-k230-sdk-rm69a10-baseline.sh "$worktree"
          fi
          test -x "$worktree/output/$TDVP_PROFILE/host/bin/riscv64-unknown-linux-gnu-readelf"
          test -d "$worktree/output/$TDVP_PROFILE/target"
          test -f "$worktree/output/$TDVP_PROFILE/build/toolchain-external-custom/.stamp_staging_installed"

      - name: Check reviewed SDK base cache size
        if: steps.restore-sdk.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          base="${RUNNER_TEMP}/tdvp-k230-sdk"
          bytes=$(du -sb \
            "$base/buildroot-overlay" \
            "$base/output/buildroot-2025.02.1" \
            "$base/output/$TDVP_PROFILE/.config" \
            "$base/output/$TDVP_PROFILE/host" \
            "$base/output/$TDVP_PROFILE/target" | awk '{sum += $1} END {print sum}')
          # GitHub Actions caches have a repository quota. Refuse an opaque
          # whole-worktree cache; the reusable package-build interface must
          # remain below the documented single-cache practical ceiling.
          test "$bytes" -lt 9663676416
          printf 'TDVP reusable SDK base cache: %s bytes\n' "$bytes"

      - name: Save the reviewed SDK base cache
        if: steps.restore-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/buildroot-overlay
            ${{ runner.temp }}/tdvp-k230-sdk/.tdvp/sdk-baseline-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/buildroot-2025.02.1
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config.old
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/Makefile
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/host
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/target
          key: ${{ env.TDVP_SDK_CACHE_KEY }}

      - name: Upload SDK base identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-r10-sdk-base-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/.tdvp/sdk-baseline-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/images/tdvp-image-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/images/k230-hardware-build-preflight.txt
          if-no-files-found: error
          retention-days: 14

      - name: Restore the target-runtime IPK base
        id: restore-runtime-base
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tdvp-r10-runtime-base
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-runtime-${{ env.TDVP_RUNTIME_BASE_CACHE_SCHEMA }}-${{ hashFiles('platforms/tdvp-k230-r1/platform.env', 'platforms/tdvp-k230-r1/*.tsv', 'scripts/build-runtime-catalog.sh', 'scripts/build-ipk.sh', 'support/elf-runtime-policy.sh') }}

      - name: Download the locked r10 image ownership manifest
        if: steps.restore-runtime-base.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          source ./platforms/tdvp-k230-r1/platform.env
          manifest="${RUNNER_TEMP}/tdvp-r10-image-base.json"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$manifest" "$IMAGE_OWNERSHIP_MANIFEST_URL"
          printf '%s  %s\n' "$IMAGE_OWNERSHIP_MANIFEST_SHA256" "$manifest" | sha256sum --check --status
          printf 'TDVP_IMAGE_PROVIDER_MANIFEST=%s\n' "$manifest" >>"$GITHUB_ENV"

      - name: Package the target-runtime IPK base once
        if: steps.restore-runtime-base.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          build_output="${RUNNER_TEMP}/tdvp-k230-sdk/output/$TDVP_PROFILE"
          export TDVP_SDK_ROOT="$build_output/host"
          export TDVP_FEED_BASE_ROOT="$build_output/target"
          bash ./scripts/build-all.sh \
            --platform tdvp-k230-r1 --release r10 \
            --output "${RUNNER_TEMP}/tdvp-r10-runtime-base" \
            --runtime-catalog-only

      - name: Verify provider alternatives in the target-runtime base
        run: |
          set -Eeuo pipefail
          runtime_feed="${RUNNER_TEMP}/tdvp-r10-runtime-base/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64"
          # The runtime catalogue is an intentionally private cache input:
          # build-all rejects a Packages index when a later batch reuses it.
          # Verify its control archives in an isolated copy that has a
          # transient deterministic index, leaving the cache protocol intact.
          runtime_verification=$(mktemp -d)
          trap 'rm -rf -- "$runtime_verification"' EXIT
          cp -a -- "$runtime_feed/." "$runtime_verification/"
          bash ./scripts/make-index.sh "$runtime_verification"
          bash ./scripts/verify-image-provider-alternatives.sh \
            --platform tdvp-k230-r1 \
            --provider-map "$runtime_verification/.tdvp-image-runtime-providers.tsv" \
            "$runtime_verification"

      - name: Save the target-runtime IPK base
        if: steps.restore-runtime-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tdvp-r10-runtime-base
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-runtime-${{ env.TDVP_RUNTIME_BASE_CACHE_SCHEMA }}-${{ hashFiles('platforms/tdvp-k230-r1/platform.env', 'platforms/tdvp-k230-r1/*.tsv', 'scripts/build-runtime-catalog.sh', 'scripts/build-ipk.sh', 'support/elf-runtime-policy.sh') }}

      - name: Upload target-runtime base evidence
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-r10-runtime-base-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tdvp-r10-runtime-base/**/.tdvp-runtime-owners.tsv
            ${{ runner.temp }}/tdvp-r10-runtime-base/**/.tdvp-runtime-ownership.tsv
            ${{ runner.temp }}/tdvp-r10-runtime-base/**/.tdvp-target-runtime-packages.tsv
            ${{ runner.temp }}/tdvp-r10-runtime-base/**/.tdvp-image-runtime-providers.tsv
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  build-package-batch:
    name: Build r10 ${{ inputs.batch }} without rebuilding the SDK
    if: inputs.mode == 'build-package-batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the feed recipe revision
        uses: actions/checkout@v6

      - name: Check out the pinned TDVP r1 firmware ABI
        uses: actions/checkout@v6
        with:
          repository: vicliu624/t-display-k230-vision-platform
          ref: 23f210938e4882dbe3663840259c2520868f3b8b
          path: firmware
          submodules: recursive
          fetch-depth: 1

      - name: Restore the pinned K230 external toolchain
        uses: actions/cache@v4
        with:
          path: firmware/.ci-cache/toolchain
          key: tdvp-k230-r1-external-toolchain-${{ hashFiles('firmware/buildroot/tools/ci-prepare-host.sh') }}

      - name: Prepare the K230 external toolchain for package builds
        working-directory: firmware
        run: bash buildroot/tools/ci-prepare-host.sh

      - name: Restore the required reviewed SDK base
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/buildroot-overlay
            ${{ runner.temp }}/tdvp-k230-sdk/.tdvp/sdk-baseline-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/buildroot-2025.02.1
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config.old
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/Makefile
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/host
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/target
          key: ${{ env.TDVP_SDK_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore the reviewed Buildroot package stamps
        id: restore-package-stamps
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.br_*
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-package-stamps
          fail-on-cache-miss: false
      - name: Verify the restored Buildroot package state
        run: |
          set -Eeuo pipefail
          output="${RUNNER_TEMP}/tdvp-k230-sdk/output/$TDVP_PROFILE"
          test -x "$output/host/bin/riscv64-unknown-linux-gnu-readelf"
          test -d "$output/target"
          test -f "$output/build/toolchain-external-custom/.stamp_staging_installed"

      - name: Restore the reviewed Buildroot source-download base
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tdvp-k230-sdk/dl
          key: ${{ env.TDVP_BUILDROOT_DL_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Restore or create the hash-locked source cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tdvp-r10-source-cache
          key: tdvp-k230-r10-source-${{ hashFiles('packages/**/source.lock') }}

      - name: Restore the firmware-matched Wayland development bridge
        id: restore-wayland-sdk-overlay
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tdvp-wayland-sdk-overlay
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-wayland-sdk-overlay-${{ env.TDVP_WAYLAND_SDK_OVERLAY_CACHE_SCHEMA }}-${{ hashFiles('scripts/prepare-tdvp-wayland-sdk-overlay.sh', 'scripts/tdvp-k230-sdk.sh') }}

      - name: Restore the required target-runtime IPK base
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tdvp-r10-runtime-base
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-runtime-${{ env.TDVP_RUNTIME_BASE_CACHE_SCHEMA }}-${{ hashFiles('platforms/tdvp-k230-r1/platform.env', 'platforms/tdvp-k230-r1/*.tsv', 'scripts/build-runtime-catalog.sh', 'scripts/build-ipk.sh', 'support/elf-runtime-policy.sh') }}
          fail-on-cache-miss: true

      - name: Materialize the immutable target-runtime base for this batch
        run: |
          set -Eeuo pipefail
          test -d "${RUNNER_TEMP}/tdvp-r10-runtime-base"
          mkdir -p candidate-dist
          cp -a "${RUNNER_TEMP}/tdvp-r10-runtime-base/." candidate-dist/

      - name: Retrieve the attested prior Audacious layer
        if: inputs.batch == 'audacious-plugins' || inputs.batch == 'audacious-app'
        env:
          GH_TOKEN: ${{ github.token }}
          TDVP_DEPENDENCY_RUN_ID: ${{ inputs.dependency_run_id }}
          TDVP_REQUESTED_BATCH: ${{ inputs.batch }}
          TDVP_SDK_CACHE_IDENTITY: ${{ env.TDVP_SDK_CACHE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$TDVP_DEPENDENCY_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "$TDVP_REQUESTED_BATCH requires one successful dependency_run_id" >&2
            exit 64
          }
          case "$TDVP_REQUESTED_BATCH" in
            audacious-plugins) expected_batch=audacious-core ;;
            audacious-app) expected_batch=audacious-plugins ;;
            *) exit 64 ;;
          esac
          mapfile -t artifacts < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$TDVP_DEPENDENCY_RUN_ID/artifacts" \
              --jq ".artifacts[].name | select(test(\"^tdvp-k230-r10-${expected_batch}-unsigned-\"))"
          )
          [[ ${#artifacts[@]} -eq 1 ]] || {
            echo "run $TDVP_DEPENDENCY_RUN_ID must expose exactly one $expected_batch artifact" >&2
            exit 65
          }
          incoming_root="$RUNNER_TEMP/tdvp-audacious-layer/$TDVP_DEPENDENCY_RUN_ID"
          mkdir -p "$incoming_root"
          gh run download "$TDVP_DEPENDENCY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "${artifacts[0]}" --dir "$incoming_root"
          manifest=$(find "$incoming_root" -type f -name tdvp-batch-manifest.tsv -print -quit)
          [[ -n "$manifest" ]] || { echo 'prior Audacious layer has no batch manifest' >&2; exit 66; }
          value() { awk -F '\t' -v key="$2" '$1 == key { print $2; exit }' "$1"; }
          [[ "$(value "$manifest" platform)" == tdvp-k230-r1 ]] || { echo 'prior layer targets another platform' >&2; exit 67; }
          [[ "$(value "$manifest" sdk_cache_key)" == "$TDVP_SDK_CACHE_IDENTITY" ]] || { echo 'prior layer has another SDK identity' >&2; exit 67; }
          [[ "$(value "$manifest" batch)" == "$expected_batch" ]] || { echo 'prior layer batch identity is invalid' >&2; exit 67; }
          staging=$(find "$incoming_root" -type f -name tdvp-build-staging-manifest.tsv -printf '%h\n' -quit)
          [[ -n "$staging" && -d "$staging/usr" ]] || { echo 'prior Audacious layer has no usable private staging state' >&2; exit 68; }
          mkdir -p "$RUNNER_TEMP/tdvp-audacious-import"
          cp -a -- "$staging/." "$RUNNER_TEMP/tdvp-audacious-import/"
          feed_dir=$(find "$incoming_root" -type d -path '*/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64' -print -quit)
          [[ -n "$feed_dir" ]] || { echo 'prior Audacious layer has no r10 feed directory' >&2; exit 68; }
          while IFS=$'\t' read -r record digest filename; do
            [[ "$record" == ipk ]] || continue
            [[ "$digest" =~ ^[0-9a-f]{64}$ && "$filename" =~ ^[A-Za-z0-9+._-]+\.ipk$ ]] || {
              echo 'prior layer has an invalid IPK attestation' >&2
              exit 69
            }
            [[ -f "$feed_dir/$filename" ]] || { echo "prior layer is missing $filename" >&2; exit 69; }
            [[ "$(sha256sum "$feed_dir/$filename" | awk '{print $1}')" == "$digest" ]] || {
              echo "prior layer hash mismatch for $filename" >&2
              exit 69
            }
          done <"$manifest"
          target_feed='candidate-dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64'
          find "$feed_dir" -maxdepth 1 -type f -name '*.ipk' -exec cp -- {} "$target_feed/" \;

      - name: Check the selected batch policy
        run: |
          set -Eeuo pipefail
          printf 'Buildroot package-stamp cache hit: %s\n' '${{ steps.restore-package-stamps.outputs.cache-hit }}'
          for script in scripts/*.sh tests/*.sh packages/*/build.sh; do bash -n "$script"; done
          bash ./tests/build-all-source-lock-policy.sh
          bash ./tests/audacious-foundation-policy.sh
          bash ./tests/audacious-package-policy.sh
          bash ./tests/archive-package-policy.sh
          bash ./tests/target-runtime-provider-deferral-policy.sh
          bash ./tests/feed-overlay-composition-policy.sh
          bash ./tests/source-lock-policy.sh
          bash ./scripts/verify-source-lock.sh --repo-root . --all

      - name: Preflight the reviewed GBA source archive
        if: inputs.batch == 'games'
        env:
          TDVP_GBA_SOURCE_CACHE: ${{ runner.temp }}/tdvp-r10-source-cache
        run: bash ./tests/tdvp-gba-source-archive-policy.sh

      - name: Preflight the reviewed SDL2 PulseAudio patch
        if: inputs.batch == 'games'
        env:
          TDVP_SDL2_SOURCE_CACHE: ${{ runner.temp }}/tdvp-r10-source-cache
        run: bash ./tests/sdl2-pulseaudio-patch-policy.sh

      - name: Install the reviewed Go host for development-tools
        if: inputs.batch == 'development-tools'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          check-latest: false

      - name: Install the reviewed RISC-V Node source-build host
        if: inputs.batch == 'nodejs'
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user
          test "$(riscv64-linux-gnu-g++ -dumpversion | cut -d. -f1)" -ge 10
          command -v qemu-riscv64

      - name: Materialize the private Audacious foundation layer
        if: inputs.batch == 'audacious-foundation'
        run: |
          set -Eeuo pipefail
          build_output="${RUNNER_TEMP}/tdvp-k230-sdk/output/$TDVP_PROFILE"
          export TDVP_AUDACIOUS_BUILDROOT_OUTPUT="$build_output"
          export TDVP_BUILDROOT_BASE_DOWNLOAD_DIR="${RUNNER_TEMP}/tdvp-k230-sdk/dl"
          export TDVP_AUDACIOUS_FOUNDATION_EVIDENCE_DIR=candidate-foundation-evidence
          bash ./scripts/prepare-audacious-foundation.sh \
            --platform tdvp-k230-r1 --sdk-root "$build_output/host"
          test -s candidate-foundation-evidence/tdvp-audacious-foundation.tsv

      - name: Build only the selected package dependency closure
        if: inputs.batch != 'audacious-foundation'
        run: |
          set -Eeuo pipefail
          case "${{ inputs.batch }}" in
            archive)
              package_args=(--package archive-tools)
              expected_packages=(libbz2 liblzma libzstd archive-tools)
              ;;
            audacious-core)
              package_args=(--package audacious-core --export-staging candidate-staging)
              expected_packages=(audacious-core)
              ;;
            audacious-plugins)
              package_args=(--import-staging "${RUNNER_TEMP}/tdvp-audacious-import" --provided-package audacious-core --package audacious-plugins --export-staging candidate-staging)
              expected_packages=(audacious-core audacious-plugins)
              ;;
            audacious-app)
              package_args=(--import-staging "${RUNNER_TEMP}/tdvp-audacious-import" --provided-package audacious-core --provided-package audacious-plugins --package audacious --export-staging candidate-staging)
              expected_packages=(audacious-core audacious-plugins audacious)
              ;;
            audacious)
              package_args=(--package audacious)
              expected_packages=(audacious-core audacious-plugins audacious)
              ;;
            network-tools)
              package_args=(--package curl --package wget --package rsync --package iperf3 --package lsof --package netcat --package htop --package nano --package dialog --package ncdu --package pv --package tmux)
              expected_packages=(curl wget rsync iperf3 lsof netcat htop nano dialog ncdu pv tmux)
              ;;
            netsurf)
              # Keep the first real image-provider installation proof narrow:
              # NetSurf is a reusable immutable payload, so this batch only
              # rebuilds its control archive against the r10 runtime graph.
              package_args=(--package tdvp-netsurf)
              expected_packages=(tdvp-netsurf)
              ;;
            media)
              # Repackage the image-owned MPV payload with provider-aware
              # dependencies.  Keep it separate from Vim so one media fix
              # never turns into an unrelated desktop-tools rebuild.
              package_args=(--package tdvp-mpv)
              expected_packages=(tdvp-mpv)
              ;;
            games)
              # This is the complete user-visible GBA closure.  Rebuilding
              # the leaf and its own feed libraries together gives every
              # dependency a coherent, upgradeable package revision.
              package_args=(--package sdl2 --package sdl2-ttf --package libmgba --package tdvp-gba)
              expected_packages=(sdl2 sdl2-ttf libmgba tdvp-gba)
              ;;
            desktop-tools)
              package_args=(--package vim --package vim-plugin-gitgutter --package tdvp-mpv --package tdvp-netsurf)
              expected_packages=(vim-runtime vim vim-plugin-gitgutter tdvp-mpv tdvp-netsurf)
              ;;
            development-tools)
              package_args=(--package tdvp-source-tools --package tdvp-dev-tools)
              expected_packages=(tdvp-source-tools tdvp-dev-tools)
              ;;
            nodejs)
              package_args=(--package tdvp-nodejs-tools)
              expected_packages=(libnode node npm-runtime npm tdvp-nodejs-tools)
              ;;
            *) echo 'unreviewed batch input' >&2; exit 64 ;;
          esac

          build_output="${RUNNER_TEMP}/tdvp-k230-sdk/output/$TDVP_PROFILE"
          export TDVP_SDK_ROOT="$build_output/host"
          export TDVP_FEED_BASE_ROOT="$build_output/target"
          export TDVP_AUDACIOUS_BUILDROOT_OUTPUT="$build_output"
          export TDVP_VIM_BUILDROOT_OUTPUT="$build_output"
          export TDVP_ARCHIVE_BUILDROOT_OUTPUT="$build_output"
          export TDVP_GIT_BUILDROOT_OUTPUT="$build_output"
          export TDVP_PYTHON3_BUILDROOT_OUTPUT="$build_output"
          export TDVP_DEVEL_BUILDROOT_OUTPUT="$build_output"
          export TDVP_NODE22_BUILDROOT_OUTPUT="$build_output"
          export TDVP_BUILDROOT_BASE_DOWNLOAD_DIR="${RUNNER_TEMP}/tdvp-k230-sdk/dl"
          export TDVP_NODE22_SOURCE_CACHE="${RUNNER_TEMP}/tdvp-r10-source-cache/nodejs"

          # The cached Buildroot host tree can contain a staging sysroot
          # symlink pointing at the temporary directory used by the runner
          # that created the cache.  Remove only that stale link.  A real
          # cached sysroot contains the external-toolchain startup objects
          # needed by package configure/link tests and must be preserved.
          staging_arch_dir="$build_output/host/riscv64-buildroot-linux-gnu"
          staging_sysroot="$staging_arch_dir/sysroot"
          if [[ -L "$staging_arch_dir" ]]; then
            rm -f -- "$staging_arch_dir"
          fi
          mkdir -p -- "$staging_sysroot"
          while IFS= read -r -d '' cached_link; do
            rm -f -- "$cached_link"
          done < <(find "$build_output/host" -type l -lname '/tmp/*' -print0)
          test -d "$staging_sysroot"

          overlay_root="${RUNNER_TEMP}/tdvp-wayland-sdk-overlay"
          if [[ '${{ steps.restore-wayland-sdk-overlay.outputs.cache-hit }}' != true ]]; then
            # The compact SDK cache retains target runtime libraries but does
            # not guarantee every source archive is retained. The SDK cache
            # can retain a Buildroot download stamp after its archive was
            # excluded, so fetch the exact Buildroot-locked FreeType archive
            # explicitly. This writes only the temporary download cache; it
            # never configures, compiles, or installs into target/.
            freetype_archive="${RUNNER_TEMP}/tdvp-k230-sdk/dl/freetype-2.13.3.tar.xz"
            if [[ ! -f "$freetype_archive" ]]; then
              curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
                --output "$freetype_archive" \
                'https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz'
            fi
            printf '%s  %s\n' \
              '0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289' \
              "$freetype_archive" | sha256sum --check --status
            bash ./scripts/prepare-tdvp-wayland-sdk-overlay.sh "$build_output" "$overlay_root"
          fi
          export TDVP_K230_WAYLAND_SDK_OVERLAY="$overlay_root"
          # Validate the generated bridge before starting a package build so a
          # missing development view fails in seconds rather than after a
          # cross-compiled dependency closure has consumed build capacity.
          # shellcheck source=/dev/null
          source ./scripts/tdvp-k230-sdk.sh
          tdvp_require_wayland_sdk_overlay

          # Only selected SHA-256-locked source inputs are fetched. The result
          # is an unsigned partial candidate; it does not publish a release.
          bash ./scripts/build-all.sh \
            --platform tdvp-k230-r1 --release r10 \
            --output candidate-dist --source-cache "${RUNNER_TEMP}/tdvp-r10-source-cache" \
            --require-source-locks --reuse-runtime-catalog "${package_args[@]}"

          case "${{ inputs.batch }}" in
            audacious-core|audacious-plugins|audacious-app)
              test -s candidate-staging/tdvp-build-staging-manifest.tsv
              ;;
          esac

          feed_dir='candidate-dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64'
          test -s "$feed_dir/Packages"
          for package in "${expected_packages[@]}"; do
            find "$feed_dir" -maxdepth 1 -type f -name "${package}_*.ipk" -print -quit | grep -q .
            grep -Eq "^Package: ${package}$" "$feed_dir/Packages"
          done
          bash ./scripts/verify-feed.sh --platform tdvp-k230-r1 "$feed_dir"
          runtime_feed="${RUNNER_TEMP}/tdvp-r10-runtime-base/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64"
          provider_map="$runtime_feed/.tdvp-image-runtime-providers.tsv"
          test -s "$provider_map"
          bash ./scripts/verify-image-provider-alternatives.sh \
            --platform tdvp-k230-r1 \
            --provider-map "$provider_map" \
            "$feed_dir"
          # build-all consumes the map while it writes control archives but
          # does not retain hidden catalogue evidence in its final directory.
          # Preserve the exact reviewed map alongside this artifact so a later
          # multi-batch merge can re-run the same release gate.
          cp "$provider_map" "$feed_dir/.tdvp-image-runtime-providers.tsv"

          manifest='candidate-dist/tdvp-batch-manifest.tsv'
          {
            printf 'format\t1\n'
            printf 'platform\ttdvp-k230-r1\n'
            printf 'release_path\t%s\n' "$(realpath --relative-to=candidate-dist "$feed_dir")"
            printf 'sdk_cache_key\t%s\n' "$TDVP_SDK_CACHE_KEY"
            printf 'recipe_revision\t%s\n' "$GITHUB_SHA"
            printf 'batch\t%s\n' "${{ inputs.batch }}"
            find "$feed_dir" -maxdepth 1 -type f -name '*.ipk' -print0 | \
              LC_ALL=C sort -z | xargs -0 -r sha256sum | \
              while read -r digest archive; do
                printf 'ipk\t%s\t%s\n' "$digest" "$(basename "$archive")"
              done
          } >"$manifest"
          test -s "$manifest"

      # A successful batch has now materialized the dependency closure and its
      # completion stamps.  Persist those stamps for the next batch; cache
      # entries are immutable, so the first successful batch seeds the shared
      # key and later batches can reuse it.
      - name: Save the materialized Buildroot package stamps
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.br_*
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-package-stamps

      - name: Save the firmware-matched Wayland development bridge
        if: success() && steps.restore-wayland-sdk-overlay.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tdvp-wayland-sdk-overlay
          key: ${{ env.TDVP_SDK_CACHE_KEY }}-wayland-sdk-overlay-${{ env.TDVP_WAYLAND_SDK_OVERLAY_CACHE_SCHEMA }}-${{ hashFiles('scripts/prepare-tdvp-wayland-sdk-overlay.sh', 'scripts/tdvp-k230-sdk.sh') }}

      - name: Upload the unsigned incremental batch
        if: inputs.batch != 'audacious-foundation'
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-r10-${{ inputs.batch }}-unsigned-${{ github.sha }}
          path: |
            candidate-dist
            candidate-staging
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Upload the Audacious foundation evidence
        if: inputs.batch == 'audacious-foundation'
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-r10-audacious-foundation-state-${{ github.sha }}
          path: candidate-foundation-evidence
          if-no-files-found: error
          retention-days: 14

  merge-package-batches:
    name: Merge verified r10 batches without recompiling
    if: inputs.mode == 'merge-batches'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the feed recipe revision
        uses: actions/checkout@v6

      - name: Check out the pinned TDVP r1 firmware ABI
        uses: actions/checkout@v6
        with:
          repository: vicliu624/t-display-k230-vision-platform
          ref: 23f210938e4882dbe3663840259c2520868f3b8b
          path: firmware
          submodules: recursive
          fetch-depth: 1

      - name: Restore the pinned K230 external toolchain
        uses: actions/cache@v4
        with:
          path: firmware/.ci-cache/toolchain
          key: tdvp-k230-r1-external-toolchain-${{ hashFiles('firmware/buildroot/tools/ci-prepare-host.sh') }}

      - name: Prepare the K230 external toolchain for closure validation
        working-directory: firmware
        run: bash buildroot/tools/ci-prepare-host.sh

      - name: Restore the reviewed SDK base required for closure validation
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tdvp-k230-sdk/buildroot-overlay
            ${{ runner.temp }}/tdvp-k230-sdk/.tdvp/sdk-baseline-manifest
            ${{ runner.temp }}/tdvp-k230-sdk/output/buildroot-2025.02.1
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/.config.old
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/Makefile
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/build/**/.stamp_*
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/host
            ${{ runner.temp }}/tdvp-k230-sdk/output/${{ env.TDVP_PROFILE }}/target
          key: ${{ env.TDVP_SDK_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Download compatible unsigned batches and compare every IPK hash
        env:
          GH_TOKEN: ${{ github.token }}
          TDVP_SOURCE_RUN_IDS: ${{ inputs.source_run_ids }}
        run: |
          set -Eeuo pipefail
          expected_release_path='tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64'
          [[ "$TDVP_SOURCE_RUN_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo 'merge-batches requires a comma-separated list of GitHub Actions run IDs' >&2
            exit 64
          }

          incoming_root="${RUNNER_TEMP}/tdvp-r10-incoming"
          merged_feed="candidate-merged/$expected_release_path"
          mkdir -p "$incoming_root" "$merged_feed"
          IFS=',' read -r -a run_ids <<< "$TDVP_SOURCE_RUN_IDS"

          manifest_value() {
            local manifest=$1 key=$2
            awk -F '\t' -v key="$key" '$1 == key { print $2; exit }' "$manifest"
          }

          for run_id in "${run_ids[@]}"; do
            run_dir="$incoming_root/$run_id"
            mkdir -p "$run_dir"
            mapfile -t artifacts < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[].name | select(test("^tdvp-k230-r10-.*-unsigned-"))'
            )
            [[ ${#artifacts[@]} -eq 1 ]] || {
              echo "run $run_id must expose exactly one unsigned incremental batch artifact" >&2
              exit 65
            }
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "${artifacts[0]}" --dir "$run_dir"

            mapfile -t manifests < <(find "$run_dir" -type f -name tdvp-batch-manifest.tsv -print | LC_ALL=C sort)
            [[ ${#manifests[@]} -eq 1 ]] || {
              echo "run $run_id must contain exactly one batch manifest" >&2
              exit 66
            }
            manifest=${manifests[0]}
            [[ "$(manifest_value "$manifest" format)" == 1 ]] || { echo "run $run_id has an unknown manifest format" >&2; exit 67; }
            [[ "$(manifest_value "$manifest" platform)" == tdvp-k230-r1 ]] || { echo "run $run_id targets another platform" >&2; exit 67; }
            [[ "$(manifest_value "$manifest" release_path)" == "$expected_release_path" ]] || { echo "run $run_id targets another release path" >&2; exit 67; }
            [[ "$(manifest_value "$manifest" sdk_cache_key)" == "$TDVP_SDK_CACHE_KEY" ]] || { echo "run $run_id has a different SDK/ABI cache identity" >&2; exit 67; }

            mapfile -t feed_dirs < <(find "$run_dir" -type d -path "*/$expected_release_path" -print | LC_ALL=C sort)
            [[ ${#feed_dirs[@]} -eq 1 ]] || { echo "run $run_id has no unambiguous feed directory" >&2; exit 68; }
            feed_dir=${feed_dirs[0]}
            ipk_count=0
            while IFS=$'\t' read -r record digest filename; do
              [[ "$record" == ipk ]] || continue
              [[ "$digest" =~ ^[0-9a-f]{64}$ && "$filename" =~ ^[A-Za-z0-9+._-]+\.ipk$ ]] || {
                echo "run $run_id has an invalid IPK manifest record" >&2
                exit 69
              }
              source_ipk="$feed_dir/$filename"
              [[ -f "$source_ipk" ]] || { echo "run $run_id is missing $filename" >&2; exit 69; }
              [[ "$(sha256sum "$source_ipk" | awk '{print $1}')" == "$digest" ]] || {
                echo "run $run_id hash mismatch for $filename" >&2
                exit 69
              }
              destination_ipk="$merged_feed/$filename"
              if [[ -e "$destination_ipk" ]]; then
                [[ "$(sha256sum "$destination_ipk" | awk '{print $1}')" == "$digest" ]] || {
                  echo "incompatible duplicate IPK: $filename" >&2
                  exit 70
                }
              else
                install -m 0644 "$source_ipk" "$destination_ipk"
              fi
              ipk_count=$((ipk_count + 1))
            done <"$manifest"
            [[ "$ipk_count" -gt 0 ]] || { echo "run $run_id declares no IPKs" >&2; exit 71; }
          done

      - name: Re-index and validate the merged candidate without compiling
        run: |
          set -Eeuo pipefail
          feed_dir='candidate-merged/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r10/riscv64'
          incoming_root="${RUNNER_TEMP}/tdvp-r10-incoming"
          build_output="${RUNNER_TEMP}/tdvp-k230-sdk/output/$TDVP_PROFILE"
          export TDVP_SDK_ROOT="$build_output/host"
          export TDVP_FEED_BASE_ROOT="$build_output/target"
          bash ./scripts/make-index.sh "$feed_dir"
          bash ./scripts/verify-feed.sh --platform tdvp-k230-r1 "$feed_dir"
          provider_map=$(find "$incoming_root" -type f -name .tdvp-image-runtime-providers.tsv -print -quit)
          [[ -n "$provider_map" ]] || { echo 'merged batches have no image-provider map' >&2; exit 72; }
          install -m 0644 "$provider_map" "$feed_dir/.tdvp-image-runtime-providers.tsv"
          bash ./scripts/verify-image-provider-alternatives.sh \
            --platform tdvp-k230-r1 --provider-map "$provider_map" "$feed_dir"
          bash ./scripts/verify-runtime-closure.sh \
            --platform tdvp-k230-r1 --base-root "$TDVP_FEED_BASE_ROOT" "$feed_dir"
          bash ./scripts/verify-target-runtime-coverage.sh \
            --platform tdvp-k230-r1 --base-root "$TDVP_FEED_BASE_ROOT" "$feed_dir"

      - name: Upload the merged unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-r10-merged-unsigned-${{ github.sha }}
          path: candidate-merged
          if-no-files-found: error
          retention-days: 14
