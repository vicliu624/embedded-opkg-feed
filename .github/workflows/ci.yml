name: Build and validate public feed

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ABI-gated packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipe revision
        uses: actions/checkout@v6

      - name: Build and validate package feed
        run: |
          ./scripts/build-all.sh --platform tdvp-k230-r1 --output dist
          ./scripts/verify-feed.sh --platform tdvp-k230-r1 \
            dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/riscv64

      - name: Upload unsigned candidate for protected offline signing
        uses: actions/upload-artifact@v4
        with:
          name: tdvp-k230-opkg-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
