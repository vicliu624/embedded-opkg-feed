name: Validate public-feed recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-feed:
    name: Build portable feed fixture and validate tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipe revision
        uses: actions/checkout@v6

      - name: Check shell tooling and build the self-contained fixture
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for recipe in packages/*/build.sh; do bash -n "$recipe"; done
          ./scripts/build-ipk.sh --platform tdvp-k230-r1 packages/tdvp-hello dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/riscv64
          ./scripts/make-index.sh dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/riscv64
          ./scripts/verify-feed.sh --platform tdvp-k230-r1 \
            dist/tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/riscv64
          channel_fixture=$(mktemp -d)
          trap 'rm -rf -- "$channel_fixture"' EXIT
          release_path=tdvp-k230-br2025.02.1-glibc2.33-rv64-lp64d-k6.6.36-r1/r2/riscv64
          mkdir -p "$channel_fixture/site/feed/$(dirname "$release_path")"
          cp -a "site/feed/$release_path" "$channel_fixture/site/feed/$release_path"
          TDVP_FEED_SITE_ROOT="$channel_fixture/site" \
            bash ./scripts/promote-stable-channel.sh --platform tdvp-k230-r1 --release r2
          TDVP_FEED_SITE_ROOT="$channel_fixture/site" \
            bash ./scripts/verify-stable-channel.sh --platform tdvp-k230-r1
          bash ./tests/build-shared-package-policy.sh
          python3 ./tests/desktop-cache-hooks.py
          python3 ./tests/runtime-closure-search-path.py
          python3 ./tests/runtime-owner-registration-policy.py
          bash ./tests/package-host-dependencies-policy.sh
          bash ./tests/common-data-library-policy.sh
          bash ./tests/common-security-library-policy.sh
          bash ./tests/python3-ai-runtime-version-policy.sh
          bash ./tests/python3-native-abi-policy.sh
          bash ./tests/python-tflite-package-policy.sh
          python3 ./tests/python-wheel-install-policy.py
          python3 ./tests/python-meson-runtime-metadata.py
          python3 ./tests/declared-dependency-closure.py
          python3 ./tests/ipk-dependency-range-preservation.py
          python3 ./scripts/verify-ai-common-library-cohort.py
          python3 ./tests/ai-python-host-preflight-policy.py
          python3 ./tests/ai-python-host-entrypoint-policy.py
          python3 ./tests/ai-common-workflow-selection.py
          python3 ./tests/build-staging-receipt.py
          python3 ./tests/source-license-projection.py
          python3 ./tests/provider-license-projection.py
          python3 ./tests/split-provider-extraction.py
          python3 ./tests/onnxruntime-native-input-order.py
          python3 ./tests/native-cmake-cache-identity.py
          python3 ./tests/onnxruntime-development-projection.py
          python3 ./tests/onnxruntime-binding-core-reuse.py
          python3 ./tests/serialization-native-provider-policy.py
          python3 ./tests/onnx-security-package-revisions.py
          python3 ./tests/first-party-ai-license-policy.py
          python3 ./tests/runtime-owner-crlf-policy.py
          python3 ./tests/image-backed-dependency-ranges.py
          bash ./tests/historical-library-migration-policy.sh
          python3 ./tests/historical-runtime-reference-policy.py
          python3 ./tests/historical-catalogue-continuity.py
          python3 ./tests/image-backed-payload.py
          python3 ./tests/image-backed-compose.py
          python3 ./tests/image-backed-upgrade.py
          python3 ./tests/feed-predecessor.py
          python3 ./tests/image-reference-audit.py
          bash ./tests/image-backed-finalization-preflight.sh
          bash ./tests/image-report-publication.sh
          bash ./tests/audacious-package-policy.sh
          bash ./tests/tdvp-wayland-sdk-overlay-protocols.sh
          python3 ./tests/buildroot-image-ownership.py
          python3 ./tests/published-sdk-contract.py
          python3 ./tests/published-sdk-cache-identity.py
          python3 ./tests/batch-policy-entrypoint.py
          bash scripts/check-batch-build-policy.sh
          bash ./tests/reuse-published-ipk-payload-policy.sh
          bash ./tests/feed-overlay-composition-policy.sh
          bash ./tests/vim-package-policy.sh

  cardputer-source-lock:
    name: Validate pinned Cardputer Zero source revision
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipe revision
        uses: actions/checkout@v6

      - name: Fetch and verify the reviewed upstream source
        shell: bash
        run: |
          set -Eeuo pipefail
          source packages/tdvp-gba/package.env
          [[ "$SOURCE_REPOSITORY" == 'https://github.com/vicliu624/cardputer-zero-gameboy-emulator' ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          source_dir=$(mktemp -d)
          trap 'rm -rf -- "$source_dir"' EXIT
          git clone --recurse-submodules --filter=blob:none "$SOURCE_REPOSITORY" "$source_dir"
          git -C "$source_dir" checkout --detach "$SOURCE_REVISION"
          git -C "$source_dir" submodule update --init --recursive
          [[ "$(git -C "$source_dir" rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          git -C "$source_dir" diff --quiet
          test -f "$source_dir/CMakeLists.txt"
          test -f "$source_dir/packaging/tdvp-k230/tdvp-gba"
          test -f "$source_dir/extern/SDL/CMakeLists.txt"
          test -f "$source_dir/extern/mgba/CMakeLists.txt"
          bash ./tests/tdvp-gba-source-archive-policy.sh
