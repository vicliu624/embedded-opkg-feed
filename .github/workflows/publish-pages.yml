name: Publish signed public feed to GitHub Pages

on:
  push:
    branches: [release]
    paths:
      - 'site/**'
      - 'keys/tdvp-repo-public.asc'
      - 'scripts/verify-feed.sh'
      - 'platforms/tdvp-k230-r1/platform.env'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-upload:
    name: Verify signed feed and upload Pages artifact
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - name: Check out reviewed release content
        uses: actions/checkout@v6

      - name: Verify every staged immutable index and detached signature
        run: |
          set -Eeuo pipefail
          found=0
          while IFS= read -r -d '' index; do
            found=1
            feed_dir=$(dirname "$index")
            ./scripts/verify-feed.sh --require-signature --platform tdvp-k230-r1 \
              "$feed_dir"
          done < <(find site/feed -type f -name Packages -print0 | LC_ALL=C sort -z)
          test "$found" -eq 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # The initial TDVP feed publication must create the Pages site;
          # subsequent runs simply reuse the existing site.
          enablement: true

      - name: Upload static public feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate-and-upload
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
