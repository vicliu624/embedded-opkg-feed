[audacious]
# The feed only builds the GTK3 interface. Keep this explicit so a historical
# per-user preference cannot request a Qt interface that is not present.
use_qt=FALSE
show_interface=TRUE
resume_playback_on_startup=TRUE
volume_delta=5

[gtkui]
# The device display is 1232x568 landscape. Labwc should normally honor this
# maximized request and compute the usable work area itself. The compact fallback
# preserves title-bar and panel space on an unmaximized Wayland session.
player_x=-1000
player_y=-1000
player_width=1184
player_height=480
player_maximized=TRUE

# A practical touch layout: one compact toolbar, no compute-heavy visualizer,
# no permanent multi-playlist strip, and the largest remaining area for songs.
menu_visible=TRUE
infoarea_visible=TRUE
infoarea_show_art=TRUE
infoarea_show_vis=FALSE
statusbar_visible=FALSE
playlist_tabs_visible=1
entry_count_visible=FALSE
close_button_visible=TRUE
playlist_headers=TRUE
playlist_headers_sortable=TRUE
symbolic_icons=TRUE
autoscroll=TRUE
