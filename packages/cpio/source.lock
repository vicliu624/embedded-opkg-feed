SOURCE_SELECTION_REASON='The cpio archive format remains useful for controlled K230 recovery and interchange tasks. The candidate builds one command without a non-platform shared-runtime provider and exposes only the distinct tdvp-cpio frontend.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 cpio.mk, cpio.hash and Config.in. The reviewed K230 profile uses glibc with wchar support; Config.in selects argp-standalone only for uClibc or musl, so the transaction introduces no argp provider. The helper copies only the reviewed cpio command ELF from the private target root.'
SECURITY_STATUS='The GNU archive SHA-256 is verified before the private offline transaction. Archive extraction is intentionally never invoked in CI and no archive or filesystem path is provided. Candidate admission additionally requires locked cache, RISC-V ELF, RPATH/RUNPATH, runtime-closure and deny-overlay gates; release review must reassess current archive-parser advisories.'
