SOURCE_SELECTION_REASON='I2C bus inspection is useful for controlled K230 hardware bring-up. The candidate builds only the five upstream CLI tools against a private static libi2c.a, so it introduces no libi2c shared-runtime provider and exposes only tdvp-i2c-* frontends.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 i2c-tools.mk, i2c-tools.hash and Config.in. The private transaction enables only BR2_PACKAGE_I2C_TOOLS, disables BR2_PACKAGE_PYTHON3 so py-smbus is not built, and forces BUILD_DYNAMIC_LIB=0, BUILD_STATIC_LIB=1 and USE_STATIC_LIB=1. It copies only the five reviewed CLI ELF files from the private target root; the temporary libi2c.a is not packaged.'
SECURITY_STATUS='The kernel.org release archive SHA-256 is verified before the private offline transaction. Candidate admission additionally requires locked cache, RISC-V ELF, RPATH/RUNPATH, runtime-closure and deny-overlay gates. CI never probes, reads, writes or enumerates an I2C bus.'
VERIFIED_BY='TDVP source-lock verifier plus Buildroot 2025.02.1 i2c-tools package hash and a streamed official archive SHA-256 check'
