SOURCE_SELECTION_REASON='Filesystem event observation is useful for controlled K230 development. The candidate builds only inotifywait and inotifywatch with the private static libinotifytools implementation, so it introduces no libinotifytools shared-runtime provider and exposes only tdvp-inotify-* frontends.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 inotify-tools.mk, inotify-tools.hash and Config.in. The private transaction enables only BR2_PACKAGE_INOTIFY_TOOLS and forces --disable-shared, --enable-static, --enable-static-binary and --disable-doxygen. The helper copies only the two reviewed command ELF files from the private target root; its temporary static archive and development headers are not packaged.'
SECURITY_STATUS='The GitHub release archive SHA-256 is verified before the private offline transaction. Candidate admission additionally requires locked cache, RISC-V ELF, RPATH/RUNPATH, runtime-closure and deny-overlay gates. CI never invokes a watcher or observes a real filesystem path.'
