SOURCE_SELECTION_REASON='Log maintenance is useful for controlled K230 development, but the feed supplies only a private command frontend. The immutable target catalogue continues to own the exact libpopt runtime; no scheduler, daemon, /etc/logrotate.conf or /etc/logrotate.d content is packaged.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 logrotate.mk, logrotate.hash and Config.in. The private transaction enables only BR2_PACKAGE_LOGROTATE, consumes the immutable target libpopt provider, disables optional BR2_PACKAGE_LIBSELINUX and BR2_PACKAGE_ACL branches, and forces --without-selinux --without-acl. The helper copies only the reviewed logrotate command ELF from its private target root; Buildroot-created /etc/logrotate.conf and /etc/logrotate.d remain outside the IPK.'
SECURITY_STATUS='The GitHub release archive SHA-256 is verified before the private offline transaction. Candidate admission additionally requires locked cache, RISC-V ELF, RPATH/RUNPATH, runtime-closure and deny-overlay gates. CI never invokes logrotate or asks it to read, rename, compress, remove or rotate any log.'
