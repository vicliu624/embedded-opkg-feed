# The Buildroot recipe supplies reviewed cross-build knowledge, but this recipe
# compiles the locked OpenSSH archive directly to avoid importing this desktop
# SDK's unrelated global PAM/server dependency graph.
FORMAT_VERSION='1'
SOURCE_TYPE='release-tarball'
UPSTREAM_NAME='OpenSSH portable'
