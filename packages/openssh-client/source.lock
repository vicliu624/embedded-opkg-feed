SOURCE_SELECTION_REASON='Git SSH transport requires an independently owned OpenSSH client. The TDVP package retains only normal client/file-transfer/agent programs; it does not import server binaries, setuid helpers, key utilities, or /etc/ssh configuration.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 openssh.mk supplies the reviewed configure choices. The direct cross-build uses only the matching SDK compiler/sysroot and its host pkgconf, with separately owned libssl-3/libcrypto-3/libz providers; no TDVP-specific patches.'
SECURITY_STATUS='OpenSSH, OpenSSL, and zlib advisory review remains a release-candidate gate; every consumed source archive is SHA-256 verified before the offline build.'
