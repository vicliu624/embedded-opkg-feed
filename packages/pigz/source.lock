SOURCE_SELECTION_REASON='Parallel gzip is a useful optional local compression command for K230. The candidate copies one private command ELF and a tdvp-pigz frontend only; it neither replaces BusyBox gzip nor publishes a shared-runtime ABI.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 pigz.mk, pigz.hash and Config.in. The locked recipe builds pigz from source with the target toolchain and zlib build dependency. The private transaction stages only pigz; the generic helper copies only that reviewed ELF beneath /usr/libexec/tdvp-pigz and emits tdvp-pigz. Its automatic ELF closure must resolve libz through the immutable target catalogue, never through an in-package library copy.'
SECURITY_STATUS='The current official HTTPS release archive SHA-256 is streamed and verified before the private offline transaction. CI builds and audits the ELF only: it never invokes pigz, supplies content, compresses data, or extracts data. pigz compression and its checksums do not authenticate content; candidate admission additionally requires locked cache, RISC-V ELF, runtime-closure and deny-overlay gates.'
