SOURCE_SELECTION_REASON='psmisc 23.7 is the latest upstream release. Its five portable procfs commands substantially extend diagnostics while preserving the K230 platform ABI: their only retained dynamic provider is the immutable libncursesw catalogue package. The 2025.02.1 Buildroot psmisc build logic is retained but its source version is explicitly overridden to this locked upstream release; the package never replaces BusyBox or firmware command paths.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 psmisc.mk, psmisc.hash and Config.in are retained only as reviewed cross-build logic. The private transaction passes PSMISC_VERSION=23.7 as one Make variable and feeds psmisc-23.7.tar.xz exclusively from the SHA-256-locked source cache. It extracts only fuser, killall, pslog, prtstat and pstree into /usr/libexec/tdvp-psmisc with five distinct tdvp-* frontends. RISC-V peekfd is excluded: upstream 23.7 does not declare a RISC-V implementation. No library, header, manpage, locale catalogue or ordinary firmware command path enters the IPK.'
SECURITY_STATUS='The official latest-release archive is SHA-256 rechecked before the private offline transaction. Review records the upstream 23.7 fixes for procfs permission/statx behaviour and does not treat absence of a database result as security assurance. CI builds and audits ELF metadata only: it never invokes fuser, killall, pslog, prtstat or pstree, supplies a PID/process/file/socket value, observes procfs, signals a process, or traverses a live process tree. Candidate admission still requires locked cache, RISC-V ELF, runtime-closure and deny-overlay gates.'
VERIFIED_BY='TDVP source-lock verifier; streamed official SourceForge HTTPS psmisc-23.7.tar.xz SHA-256 check; Buildroot 2025.02.1 psmisc build-logic review; upstream GitLab v23.7 release/tag review'
