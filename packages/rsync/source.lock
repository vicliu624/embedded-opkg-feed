SOURCE_SNAPSHOT='https://gitlab.com/buildroot.org/buildroot/-/blob/3815d578c5759fa824322ea3d95ad51b55ab888e/package/rsync/rsync.mk'
SOURCE_SELECTION_REASON='Rsync is a high-value source-maintenance and deployment command. The leaf contains only the command implementation and has exact libpopt/libz/libcrypto-3 target-catalogue dependencies. Remote-shell selection is external to the package relationship: use the platform ssh by default or explicitly select an installed tdvp-ssh wrapper with -e.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 rsync.mk/rsync.hash and the reviewed local autoreconf patch; host-pkgconf, popt, zlib, and OpenSSL archives needed by the bounded Buildroot target build. The completed matching SDK supplies host autoreconf tooling; no TDVP-specific source modification.'
SECURITY_STATUS='Rsync, OpenSSH, popt, and zlib advisory review remains a candidate-release gate. Every listed archive and the local Buildroot patch is SHA-256 verified before the private offline build.'
