# Buildroot's rsync recipe uses the local patch below during autoreconf. It
# builds against zlib and popt, each explicitly owned by the immutable target
# catalogue with an exact package version. SSH is an rsync command selection,
# not an ELF or package-provider dependency: the platform ssh remains the
# default, while an installed TDVP namespaced client is selected explicitly
# with `-e /usr/bin/tdvp-ssh`. The matched SDK enables rsync's Buildroot
# OpenSSL branch, so the leaf has an exact libcrypto-3 target ABI dependency;
# optional ACL/LZ4/xxHash/Zstd support is disabled by build.sh.
FORMAT_VERSION='1'
SOURCE_TYPE='buildroot-derived'
UPSTREAM_NAME='rsync'
UPSTREAM_LICENSE='GPL-3.0-or-later WITH OpenSSL-exception'
UPSTREAM_VERSION='3.4.1'
