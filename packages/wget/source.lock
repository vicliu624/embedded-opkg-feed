# Buildroot owns the cross-compile configuration. This lock includes GNU Wget
# and host-pkgconf, the only non-platform archive inputs consumed by the Wget
# target recipe. TLS and zlib are provided by separately owned, locked TDVP
# runtime packages through the matching K230 SDK/sysroot. The primary GNU FTP
# endpoint timed out in Actions run 33902479037 and GNU's mirror selector then
# returned 502/504 in run 33903742083, so artifact 1 uses Buildroot's official
# HTTPS backup source site. The filename, upstream version, and reviewed
# SHA-256 remain unchanged; a mirror never relaxes validation.
