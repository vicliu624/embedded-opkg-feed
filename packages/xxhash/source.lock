SOURCE_SELECTION_REASON='A fast non-cryptographic checksum command is useful for controlled local deduplication and non-security integrity prefiltering on K230. It is explicitly not an authentication, signature, or cryptographic-integrity replacement. The candidate publishes one private command and no non-platform shared-runtime provider.'
NON_PLATFORM_BUILD_INPUTS='Buildroot 2025.02.1 xxhash.mk and xxhash.hash. The private transaction overrides XXHASH_TARGETS to xxhsum and XXHASH_INSTALL_TARGETS to install_xxhsum. Upstream links xxhsum directly from xxhash.o plus CLI objects; the transaction neither builds nor installs libxxhash shared/static libraries, headers, or pkg-config metadata, and the generic helper copies only the reviewed command ELF.'
SECURITY_STATUS='The official HTTPS tag archive SHA-256 is streamed and verified before the private offline transaction. xxHash is non-cryptographic; its result must never be used for authentication, signatures, or security decisions. CI builds and audits the ELF only and never invokes xxhsum or supplies a payload. Candidate admission additionally requires locked cache, RISC-V ELF, runtime-closure and deny-overlay gates.'
